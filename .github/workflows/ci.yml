name: CI

# When does this robot wake up?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------- Job 1: is the code clean and correct? ----------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

  # ---------- Job 2: does it build and actually run? ----------
  docker:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    needs: test # only runs if the tests above passed

    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to GHCR

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally so we can smoke-test it)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ci-test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the running container
        run: |
          docker run -d --name smoke -p 8000:8000 ci-test:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "container is healthy"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "container never became healthy:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"healthy"'
          curl -fsS http://localhost:8000/api/greet/ci | grep -q 'Hello, ci!'
          curl -fsS -X POST http://localhost:8000/api/sum \
            -H 'Content-Type: application/json' \
            -d '{"numbers":[1,2,3]}' | grep -q '"sum":6'
          docker rm -f smoke

      # Pull requests only build. Pushes to main also publish.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Push the image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
