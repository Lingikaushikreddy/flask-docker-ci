[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W = style, F = real bugs, I = import order, B = likely mistakes
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# so `from app import app` works without installing the project
pythonpath = ["."]
